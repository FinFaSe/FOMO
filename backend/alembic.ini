# Alembic CLI (development): `uv run alembic revision --autogenerate -m "..."`, `uv run alembic upgrade head`.
# The database URL comes from DATABASE_URL (default sqlite:///./.data/tracker.db); never put credentials here.
[alembic]
script_location = %(here)s/tracker/migrations
prepend_sys_path = .
file_template = %%(rev)s_%%(slug)s

[loggers]
keys = root,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
